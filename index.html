<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/stylesheet.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark" id="mainNav">
      <div class="container">
        <a class="navbar-brand nav-brand" href="index.html">Name/Logo</a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarLinks"
          aria-controls="navbarLinks"
          aria-expanded="false"
          aria-label="Open navigation menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarLinks">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="reviews.html">Reviews</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="quiz.html">Quiz</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="contact.html">Contact</a>
            </li>
          </ul>

          <div id="accountContainer">
            <button
              id="accButton"
              aria-expanded="false"
              aria-controls="accMenu"
              aria-label="Account menu"
            >
              Guest
            </button>
            <div id="accMenu">
              <!-- TODO create JS to collect user details and store locally-->
              <form onsubmit="return saveDetails();">
                <label for="username">Username</label>
                <input
                  type="text"
                  id="username"
                  class="form-control"
                  name="username"
                />
                <span id="usernameErr" style="display: none"
                  >Please enter a username</span
                >
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  class="form-control"
                  name="password"
                />
                <span id="passwordErr" style="display: none"
                  >Password must be at least 6 characters</span
                >
                <input
                  type="submit"
                  class="btn btn-primary mt-2 w-100"
                  value="Submit"
                />
              </form>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <header id="hero" role="banner">
      <div class="container">
        <div id="heroContent">
          <!-- potential for some local cookie storage here with username -->
          <h1>
            Greetings <span id="heroName">newcomer</span>! Ready to Level up
            your Gaming Library?
          </h1>
          <p>Search, explore and discover the best games of 2026.</p>
          <a href="reviews.html" class="cta-link">Browse Reviews</a>
        </div>
      </div>
    </header>

    <section></section>
    <section></section>
    <main></main>
    <footer></footer>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
