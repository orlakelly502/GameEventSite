<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homepage</title>
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/stylesheet.css" />
  </head>

  <body>
    <nav id="navBar" role="navigation" aria-label="Main navigation">
      <div class="container">
        <div class="nav-inner">
          <a href="index.html">
            <span>Name/Logo PlaceHolder</span>
          </a>

          <button
            id="hamburger"
            aria-controls="navLinks"
            aria-expanded="false"
            aria-label="Open navigation menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <ul id="navBarLinks" class="navBar-links">
            <li><a href="index.html" class="navLink active">Home</a></li>
            <li><a href="reviews.html" class="navLink">Reviews</a></li>
            <li><a href="quiz.html" class="navLink">Quiz</a></li>
            <li><a href="contact.html" class="navLink">Contact</a></li>
          </ul>
          <!-- div to group button and associated drop down menu together (ensures menu appears directly below button) -->
          <div id="accountWrapper">
            <button id="accButton">Register</button>
            <div id="accMenu">
              <!-- TO DO create saveDetails JS function to store details locally-->
              <!-- TO DO add some basic validation to inputs -->
              <form onsubmit="return saveDetails();">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" />
                <span id="usernameErr" style="display: none"
                  >Please enter a username</span
                >
                <label for="password">Password</label>
                <input type="password" id="password" name="password" />
                <span id="passwordErr" style="display: none"
                  >Password must be at least 6 characters</span
                >
                <input type="submit" />
              </form>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <header id="hero" role="banner">
      <div class="container">
        <div id="heroContent">
          <!-- potential for some local cookie storage here with username -->
          <h1>
            Greetings <span id="heroName">newcomer</span>! Ready to Level up
            your Gaming Library?
          </h1>
          <p>Search, explore and discover the best games of 2026.</p>
          <a href="reviews.html" class="cta-link">Browse Reviews</a>
        </div>
      </div>
    </header>

    <section></section>
    <section></section>
    <main></main>
    <footer></footer>
    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
