                <div class="form-check mt-2 mb-1">
                  <input class="form-check-input" type="checkbox" id="stayLoggedIn" checked>
                  <label class="form-check-label" for="stayLoggedIn" style="color: var(--text-muted); font-size: 13px;">
                    Stay logged in
                  </label>
                </div>
                <input type="submit" class="btn btn-primary mt-2 w-100" value="Submit" />
              </form>
